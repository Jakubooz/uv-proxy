<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Unblocker</title>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv.config.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: white; }
        h1 { margin-bottom: 20px; }
        form { display: flex; gap: 10px; }
        input { padding: 12px 16px; width: 320px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h1>Web Unblocker</h1>
    <form id="proxy-form">
        <input type="text" id="url" placeholder="Zadej URL (např. https://poki.com)" required>
        <button type="submit">Otevřít</button>
    </form>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/uv.sw.js', { scope: __uv$config.prefix });
        }

        document.getElementById('proxy-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('url').value.trim();
            const url = input.startsWith('http://') || input.startsWith('https://') ? input : 'https://' + input;
            const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
            window.location.href = encodedUrl;
        });
    </script>
</body>
</html>
